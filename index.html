<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>צעד לתל"ב - בה"ד חיל הים</title>
    <!-- חיבור לאייקונים של FontAwesome (עבור ספר, כרטיסיות, בחנים וכו') -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --navy-dark: #0B1D3A;
            --navy-blue: #1A365D;
            --navy-light: #2B6CB0;
            --gold: #D4AF37;
            --white: #FFFFFF;
            --light-bg: #F7FAFC;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--light-bg);
            color: var(--navy-dark);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* כותרת עליונה - הירו */
        header {
            background: linear-gradient(135deg, var(--navy-dark) 0%, var(--navy-blue) 100%);
            color: var(--white);
            text-align: center;
            padding: 40px 20px;
            border-bottom: 5px solid var(--gold);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        header p {
            font-size: 1.2rem;
            color: #E2E8F0;
            font-weight: 300;
        }

        /* מכולת הכפתורים המרכזית */
        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            flex: 1;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        @media (max-width: 600px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }

        /* עיצוב כפתור/אייקון אינטראקטיבי */
        .card {
            background-color: var(--white);
            border: 2px solid #E2E8F0;
            border-radius: 15px;
            padding: 30px 20px;
            text-align: center;
            text-decoration: none;
            color: var(--navy-dark);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: var(--gold);
            box-shadow: 0 10px 15px rgba(26, 54, 93, 0.2);
            background-color: #F8FAFC;
        }

        .card i {
            font-size: 3.5rem;
            color: var(--navy-blue);
            margin-bottom: 15px;
            transition: color 0.3s ease;
        }

        .card:hover i {
            color: var(--gold);
        }

        .card h2 {
            font-size: 1.4rem;
            font-weight: 600;
        }

        /* כותרת תחתונה */
        footer {
            background-color: var(--navy-dark);
            color: var(--white);
            text-align: center;
            padding: 15px;
            font-size: 0.9rem;
            border-top: 3px solid var(--gold);
        }
    </style>
</head>
<body>

    <header>
        <h1>צעד לתל"ב - בה"ד חיל הים</h1>
        <p>כלים, פקודות ואיכות בהדרכה למפקד הים</p>
    </header>

    <div class="container">
        <div class="grid">
            
            <!-- כפתור 1: ספר תל"ב -->
            <a href="talab.html" class="card">
                <i class="fas fa-book-open"></i>
                <h2>ספר תל"ב</h2>
            </a>

            <!-- כפתור 2: כרטיסיות -->
            <a href="flashcards.html" class="card">
                <i class="fas fa-layer-group"></i>
                <h2>כרטיסיות למידה</h2>
            </a>

            <!-- כפתור 3: בחנים -->
            <a href="quizzes.html" class="card">
                <i class="fas fa-file-signature"></i>
                <h2>בחנים ותרגול</h2>
            </a>

            <!-- כפתור 4: הידעת? בה"ד חיל הים -->
            <a href="did-you-know.html" class="card">
                <i class="fas fa-anchor"></i>
                <h2>הידעת? בה"ד 600</h2>
            </a>

        </div>
    </div>

    <footer>
        <p>© 2026 בה"ד חיל הים - מדור טיפוח הדרכה (תל"ב)</p>
    </footer>

</body>
</html>
